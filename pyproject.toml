[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "q3hash"
version = "0.5.0.dev1"
description = "Experimental mixed-dimensional quantum notation and Python statevector simulator"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Q3# Project Contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.scripts]
q3hash = "q3hash.cli:main"
q3hash-verify = "q3hash.verify_cli:main"
q3hash-search = "q3hash.search_cli:main"

[project.optional-dependencies]
validation = ["numpy>=1.26", "scipy>=1.11"]
external-validation = ["cirq-core==1.7.0"]

[tool.setuptools.packages.find]
where = ["src"]
