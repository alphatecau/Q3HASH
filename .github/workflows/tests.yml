name: Python tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build tools
        run: python -m pip install build==1.6.1 setuptools==84.2.1 wheel==0.48.0
      - name: Compile Python sources
        run: python -m compileall -q src tests tools deployment
      - name: Build wheel and source archive
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python -m build --no-isolation
      - name: Test built distributions in clean environments
        run: python tools/check_distribution.py dist

  numerics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package with optional validation tools
        run: python -m pip install ".[validation]"
      - name: Compare against NumPy and SciPy
        run: python -I tools/check_numerics.py
      - name: Audit explicit encoding and complete operators
        run: python -I tools/check_encoding.py
      - name: Check v0.4 contract acceptance vectors
        run: python -I tools/check_search_contract.py
      - name: Audit bounded encoding generation independently
        run: python -I tools/check_search_generation.py
      - name: Audit exact resources and supplied-circuit Pareto fronts
        run: python -I tools/check_resources_comparison.py
      - name: Audit cumulative verification budgets and recorded reports
        run: python -I tools/check_search_evaluation.py
      - name: Audit v0.4 search CLI acceptance vectors
        run: python -I tools/check_search.py --isolated
      - name: Check v0.5 hardware design reference vectors
        run: python -I tools/check_hardware_contract.py
      - name: Audit the hardware-cost kernel against independent paths and ledgers
        run: python -I tools/check_hardware_costs.py
      - name: Audit verified hardware reports, interval fronts and recorded replay
        run: python -I tools/check_hardware_reports.py
      - name: Audit v0.5 hardware CLI acceptance vectors
        run: python -I tools/check_hardware_cli.py --isolated
      - name: Independently check three-way full operators and synthetic timing
        run: python -I tools/check_three_way_oracle.py
      - name: Verify three-way public API, negative controls and partial hardware front
        run: python -I tools/check_three_way_benchmark.py
      - name: Reproduce qubit, qutrit and active mixed encoding benchmarks
        run: python -I tools/check_encoding_integration.py
      - name: Validate localhost v0.6 web/core API and safety boundaries
        run: python -I -m unittest discover -s tests -p test_web_app.py -v

  external:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and pinned Cirq baseline
        run: python -m pip install ".[external-validation]"
      - name: Compare full operators and arbitrary states against Cirq
        run: python -I tools/check_external_operators.py

  hosted-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Install the Python service and contract validator
        run: |
          python -m pip install setuptools==84.2.1 wheel==0.48.0 jsonschema==4.26.0
          python -m pip install --no-deps --no-build-isolation .
          python -m pip check
      - name: Verify the pinned engine against Git
        run: |
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          pin = json.loads(Path('deployment/engine-source.json').read_text())
          assert len(pin['sha256']) == 42
          for path, expected in pin['sha256'].items():
              pinned = subprocess.check_output(['git', 'show', pin['source_commit'] + ':' + path])
              assert hashlib.sha256(pinned).hexdigest() == expected, path
          print("42 engine and workload file digests match their Git source.")
          PY
      - name: Exercise API and security boundaries
        run: python -I -m unittest discover -s tests -p test_render_api.py -v
      - name: Capture and validate fresh authentic Python HTTP fixtures
        run: python -I tools/check_hosted_api.py --commit "$GITHUB_SHA" --validate-schema --output "$RUNNER_TEMP/hosted-api.json"
      - name: Install, type-check and build the shared Site relay
        working-directory: integration/sites
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Run Python-to-Site contract and fail-closed checks
        working-directory: integration/sites
        run: Q3_CONTRACT_FIXTURES="$RUNNER_TEMP/hosted-api.json" npm test
      - name: Audit the shared Site build dependencies
        working-directory: integration/sites
        run: npm audit --audit-level=high
