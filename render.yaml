# Preparation only. Creating or syncing a Render Blueprint can deploy services.
previews:
  generation: 'off'
services:
  - type: web
    name: q3hash-research-api-rc
    runtime: python
    region: singapore
    plan: free
    branch: development/q3hash-v06-integration-release
    autoDeployTrigger: 'off'
    buildCommand: python -m pip install --upgrade pip==26.3 setuptools==84.2.1 wheel==0.48.0 && python -m pip install --no-build-isolation --no-deps .
    startCommand: python -I deployment/render_api.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: '3.12.16'
      - key: Q3HASH_API_KEY
        sync: false
