# PREPARATION ONLY. Creating this Render service triggers an initial deployment.
# Do not connect this Blueprint in Render until local tests and CI are verified.
services:
  - type: web
    name: q3hash-research-api
    runtime: python
    region: singapore
    plan: free
    branch: deploy/render-https-preparation
    autoDeployTrigger: off
    buildCommand: python -m pip install .
    startCommand: python deployment/render_api.py
    healthCheckPath: /healthz
    envVars:
      - key: Q3HASH_API_KEY
        sync: false
